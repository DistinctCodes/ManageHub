name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # BACKEND — NestJS
  # ─────────────────────────────────────────────
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest

    # Fresh, empty Postgres proved the checked-in migrations can build the
    # schema from nothing, in order, on every PR (issue BE-142).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: managehub
          POSTGRES_PASSWORD: managehub
          POSTGRES_DB: managehub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U managehub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USERNAME: managehub
      DATABASE_PASSWORD: managehub
      DATABASE_NAME: managehub

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Migrate fresh database (up from empty)
        run: npm run migration:run

      - name: Verify newest migration down() roundtrip
        run: |
          npm run migration:revert
          npm run migration:run

      - name: Lint
        run: npm run lint

      - name: Build (TypeScript check)
        run: npm run build

      - name: Unit tests
        run: npm run test

      - name: Dependency audit
        run: npm audit --audit-level=critical

  # ─────────────────────────────────────────────
  # FRONTEND — Next.js
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit & Component Tests
        run: npm run test:cov

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

  e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

      - name: Upload Playwright Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # ─────────────────────────────────────────────
  # CONTRACTS — require_auth coverage audit (CT-72)
  # ─────────────────────────────────────────────
  contracts-auth-audit:
    name: Contracts — require_auth coverage (CT-72)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Audit state-changing entrypoints for require_auth()
        run: bash scripts/audit_require_auth.sh
