# Build configuration for the contracts/ Cargo workspace.
#
# There is deliberately no default `[build] target`: a global wasm32 target
# makes `cargo test` build the test harness for wasm, which cannot run.
# WASM artifacts are built with an explicit target instead:
#
#   cargo build --workspace --release --target wasm32-unknown-unknown
#
# (see the root Makefile `build` target and the contracts CI job). The pinned
# toolchain and wasm32 target component live in rust-toolchain.toml.
